[project]
name = "buddy"
version = "0.1.0"
description = "Private AI onboarding buddy for codebases"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }

dependencies = [
  "typer",
  "rich",
  "sqlite-utils",
  "sentence-transformers",
  "numpy",
  "ollama",
]

[project.scripts]
buddy = "buddy.cli:app"
